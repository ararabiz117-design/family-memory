# Keep Android verification builds stable on the shared 16GB development PC.
# A smaller heap and bounded workers prevent parallel Gradle daemons from
# exhausting memory; release CI can override these values when needed.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# The approved standalone project lives under a Japanese-named user folder.
# Gradle's path check is overly strict here; UTF-8 builds are verified below.
android.overridePathCheck=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
