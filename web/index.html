<!DOCTYPE html>
<html lang="ja">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="招待された家族だけで使う、家系図と法事・贈答の記録アプリです。">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="家族の記憶">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>家族の記憶</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app-loading" role="status" aria-label="読み込み中">
    <div class="loading-title">家族の記憶</div>
    <div class="loading-card"><i></i><i></i><i></i></div>
    <div class="loading-card"><i></i><i></i><i></i></div>
    <div class="loading-card"><i></i><i></i><i></i></div>
  </div>
  <style>
    body{margin:0;background:#f5f8ff}#app-loading{box-sizing:border-box;min-height:100vh;padding:32px 20px;background:linear-gradient(135deg,#f5f8ff,#fff,#edf6f6);font-family:sans-serif;color:#273247}.loading-title{max-width:860px;margin:0 auto 24px;font-size:24px;font-weight:600}.loading-card{box-sizing:border-box;max-width:860px;margin:16px auto;padding:24px;border:1px solid #fff;border-radius:24px;background:#ffffffb8;box-shadow:0 8px 24px #33405e0a}.loading-card i{display:block;height:16px;margin:12px 0;border-radius:12px;background:linear-gradient(90deg,#e5ebf3,#f5f8fc,#e5ebf3);background-size:200% 100%;animation:loading 1.4s ease infinite}.loading-card i:first-child{width:40%;height:22px}.loading-card i:last-child{width:65%}@keyframes loading{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){.loading-card i{animation:none}}
  </style>
  <script>window.addEventListener('flutter-first-frame',function(){document.getElementById('app-loading')?.remove();});</script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
